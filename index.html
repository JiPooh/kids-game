<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>토끼랑 놀이터</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- HOME SCREEN -->
  <div class="screen active" id="home">
    <h1>🐰 토끼랑 놀이터</h1>
    <div class="sub">하고 싶은 놀이를 골라보세요</div>
    <div class="char-picker" id="char-picker">
      <button class="char-btn selected" data-char="bunny">🐰</button>
      <button class="char-btn" data-char="shark">🦈</button>
    </div>
    <div class="card-row">
      <button class="game-card ready" data-target="game-sensory">
        <div class="emoji">🐰✨</div>
        <div class="label">토끼랑 콕콕</div>
      </button>
      <button class="game-card ready" data-target="game-hidden">
        <div class="emoji">🖼️</div>
        <div class="label">숨은그림찾기</div>
      </button>
      <button class="game-card ready" data-target="game-sort">
        <div class="emoji">🥕🐇</div>
        <div class="label">당근 먹이기</div>
      </button>
    </div>
  </div>

  <!-- GAME 1: SENSORY RESPONSE -->
  <div class="screen" id="game-sensory">
    <button class="back-btn" data-home>←</button>
    <div id="bunny-wrap"></div>
    <div id="sound-gate">
      <div style="font-size:44px;">🔊</div>
      <div style="font-size:20px; font-weight:bold;">화면을 눌러서<br>소리를 켜주세요</div>
      <button class="tap-btn" id="unlock-btn">시작!</button>
    </div>
  </div>

  <!-- GAME 2: HIDDEN PICTURES -->
  <div class="screen" id="game-hidden">
    <button class="back-btn" data-home>←</button>
    <div class="cloud" style="width:70px; height:34px; left:12%; top:10%;"></div>
    <div class="cloud" style="width:50px; height:26px; left:68%; top:16%;"></div>
    <div class="bush" style="width:130px; height:64px; left:-16px; bottom:-14px;"></div>
    <div class="bush" style="width:160px; height:76px; right:-24px; bottom:-20px;"></div>
    <div class="bush" style="width:96px; height:52px; left:36%; bottom:-22px;"></div>
    <div class="hidden-counter"><span id="hidden-found-num">0</span> / <span id="hidden-total-num">0</span> 🔍</div>
    <div class="cheer-text" id="hidden-cheer-text">다 찾았어요! 🎉</div>
    <div id="hidden-scene"></div>
  </div>

  <!-- GAME 3: CARROT FEEDING -->
  <div class="screen" id="game-sort">
    <button class="back-btn" data-home>←</button>
    <div class="sort-counter"><span id="sort-count-num">0</span> <span id="sort-food-emoji">🥕</span></div>
    <div class="cheer-text" id="cheer-text">잘했어요! 🎉</div>
    <div id="sort-bunny"></div>
  </div>

</div>

<script>
(function(){
  "use strict";

  // ---------- Character system ----------
  var CHARACTERS = {
    bunny: {

          <ellipse cx="130" cy="58" rx="8" ry="30" fill="#FF8FA3"/>

        <g id="bunny-body">
          <ellipse cx="100" cy="130" rx="62" ry="55" fill="url(#bunnyIdleBody)" stroke="#EADFF0" stroke-width="3"/>

          <ellipse cx="60" cy="150" rx="11" ry="8" fill="#FBEFF7" stroke="#EADFF0" stroke-width="2"/>
          <ellipse cx="140" cy="150" rx="11" ry="8" fill="#FBEFF7" stroke="#EADFF0" stroke-width="2"/>

          <circle cx="135" cy="132" r="9" fill="#FFC9D6" opacity="0.7"/>
          <path d="M55 115 L38 110 M55 119 L36 119 M55 123 L38 128" stroke="#D9C3E0" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M145 115 L162 110 M145 119 L164 119 M145 123 L162 128" stroke="#D9C3E0" stroke-width="1.6" stroke-linecap="round"/>
          <circle cx="78" cy="118" r="8" fill="#5B3A6E"/>

          <circle cx="80.5" cy="115" r="2.4" fill="white"/>
          <circle cx="124.5" cy="115" r="2.4" fill="white"/>
          <path d="M72 108 Q78 104 84 107" stroke="#5B3A6E" stroke-width="2" fill="none" stroke-linecap="round"/>
          <path d="M128 108 Q122 104 116 107" stroke="#5B3A6E" stroke-width="2" fill="none" stroke-linecap="round"/>
          <ellipse cx="100" cy="140" rx="10" ry="7" fill="#FF8FA3"/>
          <path d="M100 147 Q90 158 78 150" stroke="#5B3A6E" stroke-width="4" fill="none" stroke-linecap="round"/>
          <path d="M100 147 Q110 158 122 150" stroke="#5B3A6E" stroke-width="4" fill="none" stroke-linecap="round"/>
        </g>`,
      sort: `
        <defs>
          <radialGradient id="bunnySortBody" cx="42%" cy="30%" r="75%">
            <stop offset="0%" stop-color="#FFFFFF"/>
            <stop offset="100%" stop-color="#F1F7E9"/>
          </radialGradient>
          <linearGradient id="bunnySortEar" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FFE1EA"/>
            <stop offset="100%" stop-color="#FFB6C8"/>
          </linearGradient>
        </defs>
        <ellipse cx="110" cy="196" rx="54" ry="9" fill="rgba(91,58,126,0.12)"/>
        <g class="ear" transform="rotate(-8 82 88)">
          <ellipse cx="82" cy="44" rx="15" ry="44" fill="url(#bunnySortEar)" stroke="#F3B9CB" stroke-width="1.5"/>
          <ellipse cx="82" cy="50" rx="7" ry="33" fill="#FF8FA3"/>
        </g>
        <g class="ear" transform="rotate(8 138 88)">
          <ellipse cx="138" cy="44" rx="15" ry="44" fill="url(#bunnySortEar)" stroke="#F3B9CB" stroke-width="1.5"/>
          <ellipse cx="138" cy="50" rx="7" ry="33" fill="#FF8FA3"/>
        </g>
        <g id="sort-body">
          <ellipse cx="110" cy="135" rx="72" ry="62" fill="url(#bunnySortBody)" stroke="#DDEBD0" stroke-width="3"/>
          <ellipse cx="68" cy="152" rx="12" ry="9" fill="#FBFFF6" stroke="#DDEBD0" stroke-width="2"/>
          <ellipse cx="152" cy="152" rx="12" ry="9" fill="#FBFFF6" stroke="#DDEBD0" stroke-width="2"/>
          <circle cx="70" cy="132" r="10" fill="#FFC9D6" opacity="0.7"/>
          <circle cx="150" cy="132" r="10" fill="#FFC9D6" opacity="0.7"/>
          <circle cx="85" cy="118" r="9" fill="#5B3A6E"/>
          <circle cx="135" cy="118" r="9" fill="#5B3A6E"/>
          <circle cx="87.8" cy="114.5" r="2.6" fill="white"/>
          <circle cx="137.8" cy="114.5" r="2.6" fill="white"/>
          <ellipse id="mouth-shape" cx="110" cy="155" rx="26" ry="19" fill="#B5406B"/>
          <ellipse cx="110" cy="160" rx="16" ry="9" fill="#7A2C4C"/>
        </g>`
    },
    shark: {
      idle: `
        <defs>
          <radialGradient id="sharkIdleBody" cx="42%" cy="28%" r="80%">
            <stop offset="0%" stop-color="#AFDCF0"/>
            <stop offset="100%" stop-color="#7EB8D8"/>
          </radialGradient>
          <linearGradient id="sharkIdleFin" x1="0%" y1="0%" x2="0%" y2="100%">

            <stop offset="100%" stop-color="#5B95AF"/>
          </linearGradient>
        </defs>
        <ellipse cx="100" cy="180" rx="48" ry="9" fill="rgba(27,58,75,0.15)"/>
        <path d="M88 90 L100 38 L112 90 Q100 78 88 90Z" fill="url(#sharkIdleFin)" stroke="#4A7F98" stroke-width="2"/>
        <g class="ear ear-l" transform="rotate(-20 65 95)">
          <path d="M65 95 Q30 70 14 58 Q34 96 48 118 Q58 108 65 95Z" fill="url(#sharkIdleFin)" stroke="#4A7F98" stroke-width="2"/>
        </g>
        <g class="ear ear-r" transform="rotate(20 135 95)">
          <path d="M135 95 Q170 70 186 58 Q166 96 152 118 Q142 108 135 95Z" fill="url(#sharkIdleFin)" stroke="#4A7F98" stroke-width="2"/>
        </g>
        <g id="bunny-body">
          <ellipse cx="100" cy="125" rx="65" ry="55" fill="url(#sharkIdleBody)" stroke="#5B95AF" stroke-width="3"/>
          <ellipse cx="100" cy="150" rx="42" ry="24" fill="#EAF8FC"/>
          <path d="M58 100 Q52 104 50 110 M62 106 Q56 110 54 116" stroke="#4A7F98" stroke-width="2.4" stroke-linecap="round" opacity="0.55"/>
          <path d="M142 100 Q148 104 150 110 M138 106 Q144 110 146 116" stroke="#4A7F98" stroke-width="2.4" stroke-linecap="round" opacity="0.55"/>
          <circle cx="78" cy="112" r="8" fill="#1B3A4B"/>
          <circle cx="122" cy="112" r="8" fill="#1B3A4B"/>
          <circle cx="80.5" cy="109" r="2.6" fill="white"/>
          <circle cx="124.5" cy="109" r="2.6" fill="white"/>
          <path d="M75 138 Q100 152 125 138 L120 145 Q100 156 80 145 Z" fill="#1B3A4B"/>
          <path d="M78 141 L83 148 L88 141 Z M96 143 L101 150 L106 143 Z M114 141 L119 148 L124 141 Z" fill="white"/>
        </g>`,
      sort: `
        <defs>
          <radialGradient id="sharkSortBody" cx="42%" cy="26%" r="80%">
            <stop offset="0%" stop-color="#AFDCF0"/>
            <stop offset="100%" stop-color="#7EB8D8"/>
          </radialGradient>
          <linearGradient id="sharkSortFin" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#8AC6E4"/>
            <stop offset="100%" stop-color="#5B95AF"/>
          </linearGradient>
        </defs>
        <ellipse cx="110" cy="196" rx="54" ry="9" fill="rgba(27,58,75,0.15)"/>
        <path d="M98 95 L110 45 L122 95 Q110 83 98 95Z" fill="url(#sharkSortFin)" stroke="#4A7F98" stroke-width="2"/>
        <g class="ear" transform="rotate(-22 70 105)">
          <path d="M70 105 Q34 80 18 68 Q40 108 52 128 Q62 118 70 105Z" fill="url(#sharkSortFin)" stroke="#4A7F98" stroke-width="2"/>
        </g>
        <g class="ear" transform="rotate(22 150 105)">
          <path d="M150 105 Q186 80 202 68 Q180 108 168 128 Q158 118 150 105Z" fill="url(#sharkSortFin)" stroke="#4A7F98" stroke-width="2"/>
        </g>
        <g id="sort-body">
          <ellipse cx="110" cy="135" rx="72" ry="62" fill="url(#sharkSortBody)" stroke="#5B95AF" stroke-width="3"/>
          <ellipse cx="110" cy="162" rx="46" ry="26" fill="#EAF8FC"/>
          <path d="M65 108 Q58 112 56 119 M69 115 Q62 119 60 126" stroke="#4A7F98" stroke-width="2.6" stroke-linecap="round" opacity="0.55"/>
          <path d="M155 108 Q162 112 164 119 M151 115 Q158 119 160 126" stroke="#4A7F98" stroke-width="2.6" stroke-linecap="round" opacity="0.55"/>
          <circle cx="85" cy="118" r="9" fill="#1B3A4B"/>
          <circle cx="135" cy="118" r="9" fill="#1B3A4B"/>
          <circle cx="87.8" cy="114.5" r="3" fill="white"/>
          <circle cx="137.8" cy="114.5" r="3" fill="white"/>
          <ellipse id="mouth-shape" cx="110" cy="155" rx="26" ry="19" fill="#1B3A4B"/>
          <path d="M88 148 L96 158 L104 148 Z M108 150 L116 160 L124 150 Z M96 160 L104 168 L112 160 Z" fill="white"/>
        </g>`
    }
  };
  var selectedChar = 'bunny';

  function renderSensoryChar(){
    var el = document.getElementById('bunny-wrap');
    if (el) el.innerHTML = '<svg viewBox="0 0 200 200">' + CHARACTERS[selectedChar].idle + '</svg>';
  }
  function renderSortChar(){
    var el = document.getElementById('sort-bunny');
    if (el) el.innerHTML = '<svg viewBox="0 0 220 220">' + CHARACTERS[selectedChar].sort + '</svg><div id="mouth-hit"></div>';
    var emojiEl = document.getElementById('sort-food-emoji');
    if (emojiEl) emojiEl.textContent = selectedChar === 'shark' ? '🐟' : '🥕';
  }

  document.querySelectorAll('.char-btn').forEach(function(btn){
    function selectChar(){
      selectedChar = btn.getAttribute('data-char');
      document.querySelectorAll('.char-btn').forEach(function(b){ b.classList.toggle('selected', b === btn); });
    }
    btn.addEventListener('touchend', function(e){ e.preventDefault(); selectChar(); }, {passive:false});
    btn.addEventListener('click', selectChar);
  });

  // ---------- Navigation ----------
  var screens = document.querySelectorAll('.screen');
  function showScreen(id){
    screens.forEach(function(s){ s.classList.toggle('active', s.id === id); });
  }
  document.querySelectorAll('[data-target]').forEach(function(btn){
    function openTarget(){
      var target = btn.getAttribute('data-target');
      if (target === 'game-sensory') renderSensoryChar();
      if (target === 'game-sort') renderSortChar();
      showScreen(target);
    }
    btn.addEventListener('touchend', function(e){
      e.preventDefault();
      openTarget();
    }, {passive:false});
    btn.addEventListener('click', openTarget);
  });
  document.querySelectorAll('[data-home]').forEach(function(btn){
    btn.addEventListener('touchend', function(e){ e.preventDefault(); showScreen('home'); }, {passive:false});
    btn.addEventListener('click', function(){ showScreen('home'); });
  });

  // Block iOS gestures globally (pinch-zoom, double-tap-zoom, pull-to-refresh)
  document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
  document.addEventListener('touchmove', function(e){ e.preventDefault(); }, {passive:false});
  var lastTouchEnd = 0;
  document.addEventListener('touchend', function(e){
    var now = Date.now();
    if (now - lastTouchEnd <= 300) e.preventDefault();
    lastTouchEnd = now;
  }, {passive:false});

  // ---------- Audio ----------
  var audioCtx = null;
  function ensureCtx(){
    if (!audioCtx){
      var AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function playTone(freq, duration, delay, gain){
    var ctx = ensureCtx();
    var t0 = ctx.currentTime + (delay||0);
    var osc = ctx.createOscillator();
    var g = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(gain||0.25, t0+0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t0+duration);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0+duration+0.02);
  }

  function playPop(){
    var freq = 500 + Math.random()*400;
    playTone(freq, 0.18, 0, 0.2);
    playTone(freq*1.5, 0.12, 0.02, 0.1);
  }

  function playGiggle(){
    var base = 700;
    [0,0.09,0.18].forEach(function(delay, i){
      playTone(base + i*160, 0.16, delay, 0.22);
    });
  }

  var unlockBtn = document.getElementById('unlock-btn');
  var soundGate = document.getElementById('sound-gate');
  function unlockAudio(){
    ensureCtx();
    playTone(880, 0.15, 0, 0.15);
    soundGate.style.display = 'none';
  }
  unlockBtn.addEventListener('touchend', function(e){ e.preventDefault(); unlockAudio(); }, {passive:false});
  unlockBtn.addEventListener('click', unlockAudio);

  // ---------- Sensory game: particles ----------
  var gameEl = document.getElementById('game-sensory');
  var bunnyWrap = document.getElementById('bunny-wrap');
  var palette = ['#FF8FA3','#FFD966','#8CD790','#8FD3FF','#C9A6E0'];
  var colorIdx = 0;

  function spawnParticle(container, x, y){
    var p = document.createElement('div');
    p.className = 'particle';
    var size = 26 + Math.random()*30;
    var color = palette[colorIdx % palette.length];
    colorIdx++;
    p.style.width = size+'px';
    p.style.height = size+'px';
    p.style.left = (x - size/2)+'px';
    p.style.top = (y - size/2)+'px';
    p.style.background = color;
    p.style.opacity = '0.85';
    container.appendChild(p);

    var dx = (Math.random()-0.5) * 120;
    var dy = -(60 + Math.random()*100);
    var start = null;
    var duration = 650;

    function step(ts){
      if (!start) start = ts;
      var progress = Math.min((ts-start)/duration, 1);
      p.style.transform = 'translate(' + (dx*progress) + 'px,' + (dy*progress) + 'px) scale(' + (1 - progress*0.4) + ')';
      p.style.opacity = String(0.85 * (1-progress));
      if (progress < 1){
        requestAnimationFrame(step);
      } else {
        p.remove();
      }
    }
    requestAnimationFrame(step);
  }

  function flashBackground(){
    var color = palette[colorIdx % palette.length];
    gameEl.style.backgroundColor = color + '33'; // soft tint
    clearTimeout(flashBackground._t);
    flashBackground._t = setTimeout(function(){
      gameEl.style.backgroundColor = '#FFF8EC';
    }, 280);
  }

  function isTouchOnBunny(x, y){
    var rect = bunnyWrap.getBoundingClientRect();
    var cx = rect.left + rect.width/2;
    var cy = rect.top + rect.height/2;
    var r = rect.width/2 * 0.9;
    var dist = Math.hypot(x-cx, y-cy);
    return dist < r;
  }

  var bunnyTimer = null;
  function reactBunny(){
    bunnyWrap.classList.remove('happy');
    void bunnyWrap.offsetWidth; // restart animation
    bunnyWrap.classList.add('happy');
    playGiggle();
    clearTimeout(bunnyTimer);
    bunnyTimer = setTimeout(function(){ bunnyWrap.classList.remove('happy'); }, 500);
  }

  function handleTouches(touchList){
    for (var i=0; i<touchList.length; i++){
      var t = touchList[i];
      spawnParticle(gameEl, t.clientX, t.clientY);
      if (isTouchOnBunny(t.clientX, t.clientY)){
        reactBunny();
      } else {
        playPop();
        flashBackground();
      }
    }
  }

  gameEl.addEventListener('touchstart', function(e){
    e.preventDefault();
    ensureCtx();
    handleTouches(e.changedTouches);
  }, {passive:false});

  // Mouse fallback for desktop testing
  gameEl.addEventListener('mousedown', function(e){
    handleTouches([{clientX:e.clientX, clientY:e.clientY}]);
  });

  // ---------- Carrot feeding game ----------
  function playChomp(){
    playTone(220, 0.12, 0, 0.28);
    playTone(150, 0.16, 0.06, 0.22);
  }
  function playCheer(){
    [0,0.1,0.2,0.32].forEach(function(delay, i){
      playTone(520 + i*130, 0.2, delay, 0.22);
    });
  }

  var sortEl = document.getElementById('game-sort');
  var sortBunny = document.getElementById('sort-bunny');
  var countNumEl = document.getElementById('sort-count-num');
  var cheerTextEl = document.getElementById('cheer-text');
  var fedCount = 0;
  var carrotSlots = [0.28, 0.5, 0.72]; // x fraction of screen width
  var slotY = 0.82; // y fraction of screen height
  var activeDrags = {}; // touch identifier -> {el, offsetX, offsetY}

  function carrotSVG(){
    return '<svg viewBox="0 0 60 96">' +
      '<path d="M30 8 L46 90 Q30 100 14 90 Z" fill="#FF9F45"/>' +
      '<path d="M30 8 L40 88 Q30 94 20 88 Z" fill="#FFB565"/>' +
      '<path d="M30 4 L20 -14" stroke="#4E9F52" stroke-width="6" stroke-linecap="round"/>' +
      '<path d="M30 4 L30 -18" stroke="#5FBE63" stroke-width="6" stroke-linecap="round"/>' +
      '<path d="M30 4 L40 -14" stroke="#4E9F52" stroke-width="6" stroke-linecap="round"/>' +
      '</svg>';
  }

  function fishSVG(){
    return '<svg viewBox="0 0 60 96">' +
      '<ellipse cx="30" cy="40" rx="22" ry="30" fill="#7EC8E3" stroke="#4F9BC0" stroke-width="3"/>' +
      '<path d="M30 66 L16 94 L30 78 L44 94 Z" fill="#4F9BC0"/>' +
      '<path d="M10 36 Q0 32 2 44 Q4 54 14 48 Z" fill="#9BD7EC" stroke="#4F9BC0" stroke-width="1.5"/>' +
      '<path d="M50 36 Q60 32 58 44 Q56 54 46 48 Z" fill="#9BD7EC" stroke="#4F9BC0" stroke-width="1.5"/>' +
      '<circle cx="23" cy="26" r="5" fill="#1F3B4D"/>' +
      '<circle cx="21" cy="24" r="1.6" fill="white"/>' +
      '<path d="M18 46 Q30 54 42 46" stroke="#1F3B4D" stroke-width="2.5" fill="none" stroke-linecap="round"/>' +
      '</svg>';
  }

  function foodSVG(){
    return selectedChar === 'shark' ? fishSVG() : carrotSVG();
  }

  function makeCarrotAt(slotIndex){
    var w = window.innerWidth, h = window.innerHeight;
    var homeLeft = w*carrotSlots[slotIndex] - 32;
    var homeTop = h*slotY - 48;
    var el = document.createElement('div');
    el.className = 'carrot';
    el.style.left = homeLeft+'px';
    el.style.top = homeTop+'px';
    el.style.transform = 'scale(0)';
    el.dataset.slot = String(slotIndex);
    el.dataset.homeLeft = String(homeLeft);
    el.dataset.homeTop = String(homeTop);
    el.innerHTML = foodSVG();
    sortEl.appendChild(el);
    requestAnimationFrame(function(){
      el.style.transition = 'transform .25s cubic-bezier(.34,1.6,.64,1)';
      el.style.transform = 'scale(1)';
      setTimeout(function(){ el.style.transition = ''; }, 260);
    });
    bindCarrotDrag(el);
    return el;
  }

  function bindCarrotDrag(el){
    el.addEventListener('touchstart', function(e){
      e.preventDefault();
      ensureCtx();
      var t = e.changedTouches[0];
      var rect = el.getBoundingClientRect();
      activeDrags[t.identifier] = {
        el: el,
        offsetX: t.clientX - rect.left,
        offsetY: t.clientY - rect.top
      };
      el.classList.add('dragging');
    }, {passive:false});
    el.addEventListener('mousedown', function(e){
      e.preventDefault();
      ensureCtx();
      var rect = el.getBoundingClientRect();
      activeDrags['mouse'] = {
        el: el,
        offsetX: e.clientX - rect.left,
        offsetY: e.clientY - rect.top
      };
      el.classList.add('dragging');
    });
  }

  sortEl.addEventListener('touchmove', function(e){
    e.preventDefault();
    for (var i=0; i<e.changedTouches.length; i++){
      var t = e.changedTouches[i];
      var drag = activeDrags[t.identifier];
      if (!drag) continue;
      drag.el.style.left = (t.clientX - drag.offsetX)+'px';
      drag.el.style.top = (t.clientY - drag.offsetY)+'px';
    }
  }, {passive:false});

  document.addEventListener('mousemove', function(e){
    var drag = activeDrags['mouse'];
    if (!drag) return;
    drag.el.style.left = (e.clientX - drag.offsetX)+'px';
    drag.el.style.top = (e.clientY - drag.offsetY)+'px';
  });
  document.addEventListener('mouseup', function(){
    var drag = activeDrags['mouse'];
    if (!drag) return;
    finishDrag(drag.el);
    delete activeDrags['mouse'];
  });

  function returnHome(el){
    el.style.transition = 'left .25s ease, top .25s ease';
    el.style.left = el.dataset.homeLeft+'px';
    el.style.top = el.dataset.homeTop+'px';
    setTimeout(function(){ el.style.transition = ''; }, 260);
  }

  function reactSortBunny(){
    sortBunny.classList.remove('eating');
    void sortBunny.offsetWidth;
    sortBunny.classList.add('eating');
    setTimeout(function(){ sortBunny.classList.remove('eating'); }, 420);
  }

  function showCheer(){
    cheerTextEl.classList.remove('show');
    void cheerTextEl.offsetWidth;
    cheerTextEl.classList.add('show');
  }

  function spawnConfetti(){
    var w = window.innerWidth;
    for (var i=0; i<14; i++){
      spawnParticle(sortEl, w/2 + (Math.random()-0.5)*160, window.innerHeight*0.35);
    }
  }

  function feedCarrot(el){
    var slotIndex = parseInt(el.dataset.slot, 10);
    el.style.transition = 'transform .25s ease, opacity .25s ease';
    el.style.transform = 'scale(0.2)';
    el.style.opacity = '0';
    playChomp();
    reactSortBunny();
    fedCount++;
    countNumEl.textContent = String(fedCount);
    if (fedCount % 5 === 0){
      playCheer();
      showCheer();
      spawnConfetti();
    }
    setTimeout(function(){
      el.remove();
      makeCarrotAt(slotIndex);
    }, 260);
  }

  function finishDrag(el){
    el.classList.remove('dragging');
    var carrotRect = el.getBoundingClientRect();
    var cx = carrotRect.left + carrotRect.width/2;
    var cy = carrotRect.top + carrotRect.height*0.3;
    var mouthHit = document.getElementById('mouth-hit');
    var mouthRect = mouthHit.getBoundingClientRect();
    var mx = mouthRect.left + mouthRect.width/2;
    var my = mouthRect.top + mouthRect.height/2;
    var dist = Math.hypot(cx-mx, cy-my);
    var threshold = Math.max(mouthRect.width, mouthRect.height) * 0.85;
    if (dist < threshold){
      feedCarrot(el);
    } else {
      returnHome(el);
    }
  }

  sortEl.addEventListener('touchend', function(e){
    for (var i=0; i<e.changedTouches.length; i++){
      var t = e.changedTouches[i];
      var drag = activeDrags[t.identifier];
      if (!drag) continue;
      finishDrag(drag.el);
      delete activeDrags[t.identifier];
    }
  }, {passive:false});
  sortEl.addEventListener('touchcancel', function(e){
    for (var i=0; i<e.changedTouches.length; i++){
      var t = e.changedTouches[i];
      var drag = activeDrags[t.identifier];
      if (!drag) continue;
      returnHome(drag.el);
      delete activeDrags[t.identifier];
    }
  }, {passive:false});

  var sortInitializedFor = null;
  document.querySelector('[data-target="game-sort"]').addEventListener('click', initSortGame);
  document.querySelector('[data-target="game-sort"]').addEventListener('touchend', initSortGame);
  function initSortGame(){
    if (sortInitializedFor === selectedChar) return;
    sortInitializedFor = selectedChar;
    document.querySelectorAll('.carrot').forEach(function(el){ el.remove(); });
    for (var i=0; i<carrotSlots.length; i++){ makeCarrotAt(i); }
  }

  // ---------- Hidden picture game ----------
  function playChime(){
    playTone(880, 0.16, 0, 0.22);
    playTone(1180, 0.18, 0.07, 0.18);
  }
  function playFanfare(){
    [0,0.12,0.24,0.4].forEach(function(delay, i){
      playTone(560 + i*140, 0.22, delay, 0.24);
    });
  }

  var hiddenEl = document.getElementById('game-hidden');
  var hiddenSceneEl = document.getElementById('hidden-scene');
  var hiddenFoundNumEl = document.getElementById('hidden-found-num');
  var hiddenTotalNumEl = document.getElementById('hidden-total-num');
  var hiddenCheerEl = document.getElementById('hidden-cheer-text');
  var hiddenPositions = [
    {x:0.22, y:0.32},
    {x:0.76, y:0.24},
    {x:0.50, y:0.52},
    {x:0.18, y:0.74},
    {x:0.80, y:0.70}
  ];
  var hiddenItemSets = [
    ['⭐','🌸','🍎','🦋','💛'],
    ['🍄','🎈','🍒','🐝','🌼'],
    ['🌟','🍭','🐞','🌈','🍓']
  ];
  var hiddenRound = 0;
  var hiddenFound = 0;
  var hiddenTotal = 0;

  function buildHiddenRound(){
    hiddenSceneEl.innerHTML = '';
    hiddenFound = 0;
    var items = hiddenItemSets[hiddenRound % hiddenItemSets.length];
    hiddenTotal = items.length;
    hiddenFoundNumEl.textContent = String(hiddenFound);
    hiddenTotalNumEl.textContent = String(hiddenTotal);

    var w = window.innerWidth, h = window.innerHeight;
    items.forEach(function(emoji, i){
      var pos = hiddenPositions[i % hiddenPositions.length];
      var spot = document.createElement('div');
      spot.className = 'hidden-spot';
      spot.textContent = emoji;
      spot.style.left = (w*pos.x) + 'px';
      spot.style.top = (h*pos.y) + 'px';
      spot.dataset.found = '0';
      bindHiddenSpot(spot);
      hiddenSceneEl.appendChild(spot);
    });
  }

  function bindHiddenSpot(spot){
    function reveal(){
      if (spot.dataset.found === '1') return;
      spot.dataset.found = '1';
      spot.classList.add('found');
      ensureCtx();
      playChime();
      var rect = spot.getBoundingClientRect();
      var cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
      for (var i=0; i<8; i++){ spawnParticle(hiddenEl, cx, cy); }
      hiddenFound++;
      hiddenFoundNumEl.textContent = String(hiddenFound);
      if (hiddenFound >= hiddenTotal){
        setTimeout(function(){
          playFanfare();
          hiddenCheerEl.classList.remove('show');
          void hiddenCheerEl.offsetWidth;
          hiddenCheerEl.classList.add('show');
          var w = window.innerWidth;
          for (var i=0; i<14; i++){
            spawnParticle(hiddenEl, w/2 + (Math.random()-0.5)*160, window.innerHeight*0.35);
          }
          hiddenRound++;
          setTimeout(buildHiddenRound, 1400);
        }, 300);
      }
    }
    spot.addEventListener('touchend', function(e){ e.preventDefault(); reveal(); }, {passive:false});
    spot.addEventListener('click', reveal);
  }

  var hiddenInitialized = false;
  document.querySelector('[data-target="game-hidden"]').addEventListener('click', initHiddenGame);
  document.querySelector('[data-target="game-hidden"]').addEventListener('touchend', initHiddenGame);
  function initHiddenGame(){
    if (hiddenInitialized) return;
    hiddenInitialized = true;
    buildHiddenRound();
  }

})();
</script>
</body>
</html>
