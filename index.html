<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>토끼랑 놀이터</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- HOME SCREEN -->
  <div class="screen active" id="home">
    <h1>🐰 토끼랑 놀이터</h1>
    <div class="sub">하고 싶은 놀이를 골라보세요</div>
    <div class="char-picker" id="char-picker">
      <button class="char-btn selected" data-char="bunny">🐰</button>
      <button class="char-btn" data-char="shark">🦈</button>
    </div>
    <div class="card-row">
      <button class="game-card ready" data-target="game-sensory">
        <div class="emoji" id="sensory-card-emoji">🐰✨</div>
        <div class="label" id="sensory-card-label">토끼랑 콕콕</div>
      </button>
      <button class="game-card ready" data-target="game-hidden">
        <div class="emoji">🖼️</div>
        <div class="label">숨은그림찾기</div>
      </button>
      <button class="game-card ready" data-target="game-sort">
        <div class="emoji" id="sort-card-emoji">🥕🐇</div>
        <div class="label" id="sort-card-label">당근 먹이기</div>
      </button>
    </div>
  </div>

  <!-- GAME 1: SENSORY RESPONSE -->
  <div class="screen" id="game-sensory">
    <button class="back-btn" data-home>←</button>
    <div id="bunny-wrap"></div>
    <div id="sound-gate">
      <div style="font-size:44px;">🔊</div>
      <div style="font-size:20px; font-weight:bold;">화면을 눌러서<br>소리를 켜주세요</div>
      <button class="tap-btn" id="unlock-btn">시작!</button>
    </div>
  </div>

  <!-- GAME 2: HIDDEN PICTURES -->
  <div class="screen" id="game-hidden">
    <button class="back-btn" data-home>←</button>
    <div class="cloud" style="width:70px; height:34px; left:12%; top:10%;"></div>
    <div class="cloud" style="width:50px; height:26px; left:68%; top:16%;"></div>
    <div class="bush" style="width:130px; height:64px; left:-16px; bottom:-14px;"></div>
    <div class="bush" style="width:160px; height:76px; right:-24px; bottom:-20px;"></div>
    <div class="bush" style="width:96px; height:52px; left:36%; bottom:-22px;"></div>
    <div class="hidden-counter"><span id="hidden-found-num">0</span> / <span id="hidden-total-num">0</span> 🔍</div>
    <div class="cheer-text" id="hidden-cheer-text">다 찾았어요! 🎉</div>
    <div id="hidden-scene"></div>
  </div>

  <!-- GAME 3: CARROT FEEDING -->
  <div class="screen" id="game-sort">
    <button class="back-btn" data-home>←</button>
    <div class="sort-counter"><span id="sort-count-num">0</span> <span id="sort-food-emoji">🥕</span></div>
    <div class="cheer-text" id="cheer-text">잘했어요! 🎉</div>
    <div id="sort-bunny"></div>
  </div>

</div>

<script>
(function(){
  "use strict";

  // ---------- Character system ----------
  var CHARACTER_IMAGES = {
    bunny: 'assets/bunny.svg',
    shark: 'assets/shark.svg'
  };
  // mouth-hit target position differs per character since the artwork isn't hand-fit to this app
  var MOUTH_HIT_POS = {
    bunny: { left: '50%', top: '76%' },
    shark: { left: '32%', top: '58%' }
  };
  var selectedChar = 'bunny';

  var HOME_CARD_LABELS = {
    bunny: { sensoryEmoji: '🐰✨', sensoryLabel: '토끼랑 콕콕', sortEmoji: '🥕🐇', sortLabel: '당근 먹이기' },
    shark: { sensoryEmoji: '🦈✨', sensoryLabel: '상어랑 콕콕', sortEmoji: '🐟🦈', sortLabel: '물고기 먹이기' }
  };

  function updateHomeCards(){
    var labels = HOME_CARD_LABELS[selectedChar] || HOME_CARD_LABELS.bunny;
    document.getElementById('sensory-card-emoji').textContent = labels.sensoryEmoji;
    document.getElementById('sensory-card-label').textContent = labels.sensoryLabel;
    document.getElementById('sort-card-emoji').textContent = labels.sortEmoji;
    document.getElementById('sort-card-label').textContent = labels.sortLabel;
  }

  function renderSensoryChar(){
    var el = document.getElementById('bunny-wrap');
    if (el) el.innerHTML = '<img class="char-img" src="' + CHARACTER_IMAGES[selectedChar] + '" alt="' + selectedChar + '">';
  }
  function renderSortChar(){
    var el = document.getElementById('sort-bunny');
    if (el) el.innerHTML = '<img class="char-img" src="' + CHARACTER_IMAGES[selectedChar] + '" alt="' + selectedChar + '"><div id="mouth-hit"></div>';
    var mouthHitEl = document.getElementById('mouth-hit');
    var pos = MOUTH_HIT_POS[selectedChar];
    if (mouthHitEl && pos){
      mouthHitEl.style.left = pos.left;
      mouthHitEl.style.top = pos.top;
    }
    var emojiEl = document.getElementById('sort-food-emoji');
    if (emojiEl) emojiEl.textContent = selectedChar === 'shark' ? '🐟' : '🥕';
  }

  document.querySelectorAll('.char-btn').forEach(function(btn){
    function selectChar(){
      selectedChar = btn.getAttribute('data-char');
      document.querySelectorAll('.char-btn').forEach(function(b){ b.classList.toggle('selected', b === btn); });
      updateHomeCards();
    }
    btn.addEventListener('touchend', function(e){ e.preventDefault(); selectChar(); }, {passive:false});
    btn.addEventListener('click', selectChar);
  });

  // ---------- Navigation ----------
  var screens = document.querySelectorAll('.screen');
  function showScreen(id){
    screens.forEach(function(s){ s.classList.toggle('active', s.id === id); });
  }
  document.querySelectorAll('[data-target]').forEach(function(btn){
    function openTarget(){
      var target = btn.getAttribute('data-target');
      if (target === 'game-sensory') renderSensoryChar();
      if (target === 'game-sort') renderSortChar();
      showScreen(target);
    }
    btn.addEventListener('touchend', function(e){
      e.preventDefault();
      openTarget();
    }, {passive:false});
    btn.addEventListener('click', openTarget);
  });
  document.querySelectorAll('[data-home]').forEach(function(btn){
    btn.addEventListener('touchend', function(e){ e.preventDefault(); showScreen('home'); }, {passive:false});
    btn.addEventListener('click', function(){ showScreen('home'); });
  });

  // Block iOS gestures globally (pinch-zoom, double-tap-zoom, pull-to-refresh)
  document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
  document.addEventListener('touchmove', function(e){ e.preventDefault(); }, {passive:false});
  var lastTouchEnd = 0;
  document.addEventListener('touchend', function(e){
    var now = Date.now();
    if (now - lastTouchEnd <= 300) e.preventDefault();
    lastTouchEnd = now;
  }, {passive:false});

  // ---------- Audio ----------
  var audioCtx = null;
  function ensureCtx(){
    if (!audioCtx){
      var AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function playTone(freq, duration, delay, gain){
    var ctx = ensureCtx();
    var t0 = ctx.currentTime + (delay||0);
    var osc = ctx.createOscillator();
    var g = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(gain||0.25, t0+0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t0+duration);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0+duration+0.02);
  }

  function playPop(){
    var freq = 500 + Math.random()*400;
    playTone(freq, 0.18, 0, 0.2);
    playTone(freq*1.5, 0.12, 0.02, 0.1);
  }

  function playGiggle(){
    var base = 700;
    [0,0.09,0.18].forEach(function(delay, i){
      playTone(base + i*160, 0.16, delay, 0.22);
    });
  }

  var unlockBtn = document.getElementById('unlock-btn');
  var soundGate = document.getElementById('sound-gate');
  function unlockAudio(){
    ensureCtx();
    playTone(880, 0.15, 0, 0.15);
    soundGate.style.display = 'none';
  }
  unlockBtn.addEventListener('touchend', function(e){ e.preventDefault(); unlockAudio(); }, {passive:false});
  unlockBtn.addEventListener('click', unlockAudio);

  // ---------- Sensory game: particles ----------
  var gameEl = document.getElementById('game-sensory');
  var bunnyWrap = document.getElementById('bunny-wrap');
  var palette = ['#FF8FA3','#FFD966','#8CD790','#8FD3FF','#C9A6E0'];
  var colorIdx = 0;

  function spawnParticle(container, x, y){
    var p = document.createElement('div');
    p.className = 'particle';
    var size = 26 + Math.random()*30;
    var color = palette[colorIdx % palette.length];
    colorIdx++;
    p.style.width = size+'px';
    p.style.height = size+'px';
    p.style.left = (x - size/2)+'px';
    p.style.top = (y - size/2)+'px';
    p.style.background = color;
    p.style.opacity = '0.85';
    container.appendChild(p);

    var dx = (Math.random()-0.5) * 120;
    var dy = -(60 + Math.random()*100);
    var start = null;
    var duration = 650;

    function step(ts){
      if (!start) start = ts;
      var progress = Math.min((ts-start)/duration, 1);
      p.style.transform = 'translate(' + (dx*progress) + 'px,' + (dy*progress) + 'px) scale(' + (1 - progress*0.4) + ')';
      p.style.opacity = String(0.85 * (1-progress));
      if (progress < 1){
        requestAnimationFrame(step);
      } else {
        p.remove();
      }
    }
    requestAnimationFrame(step);
  }

  function flashBackground(){
    var color = palette[colorIdx % palette.length];
    gameEl.style.backgroundColor = color + '33'; // soft tint
    clearTimeout(flashBackground._t);
    flashBackground._t = setTimeout(function(){
      gameEl.style.backgroundColor = '#FFF8EC';
    }, 280);
  }

  function isTouchOnBunny(x, y){
    var rect = bunnyWrap.getBoundingClientRect();
    var cx = rect.left + rect.width/2;
    var cy = rect.top + rect.height/2;
    var r = rect.width/2 * 0.9;
    var dist = Math.hypot(x-cx, y-cy);
    return dist < r;
  }

  var bunnyTimer = null;
  function reactBunny(){
    bunnyWrap.classList.remove('happy');
    void bunnyWrap.offsetWidth; // restart animation
    bunnyWrap.classList.add('happy');
    playGiggle();
    clearTimeout(bunnyTimer);
    bunnyTimer = setTimeout(function(){ bunnyWrap.classList.remove('happy'); }, 500);
  }

  function handleTouches(touchList){
    for (var i=0; i<touchList.length; i++){
      var t = touchList[i];
      spawnParticle(gameEl, t.clientX, t.clientY);
      if (isTouchOnBunny(t.clientX, t.clientY)){
        reactBunny();
      } else {
        playPop();
        flashBackground();
      }
    }
  }

  gameEl.addEventListener('touchstart', function(e){
    e.preventDefault();
    ensureCtx();
    handleTouches(e.changedTouches);
  }, {passive:false});

  // Mouse fallback for desktop testing
  gameEl.addEventListener('mousedown', function(e){
    handleTouches([{clientX:e.clientX, clientY:e.clientY}]);
  });

  // ---------- Carrot feeding game ----------
  function playChomp(){
    playTone(220, 0.12, 0, 0.28);
    playTone(150, 0.16, 0.06, 0.22);
  }
  function playCheer(){
    [0,0.1,0.2,0.32].forEach(function(delay, i){
      playTone(520 + i*130, 0.2, delay, 0.22);
    });
  }

  var sortEl = document.getElementById('game-sort');
  var sortBunny = document.getElementById('sort-bunny');
  var countNumEl = document.getElementById('sort-count-num');
  var cheerTextEl = document.getElementById('cheer-text');
  var fedCount = 0;
  var carrotSlots = [0.28, 0.5, 0.72]; // x fraction of screen width
  var slotY = 0.82; // y fraction of screen height
  var activeDrags = {}; // touch identifier -> {el, offsetX, offsetY}

  var FOOD_SETS = {
    bunny: ['assets/carrot.svg', 'assets/apple.svg', 'assets/strawberry.svg'],
    shark: ['assets/fish.svg', 'assets/shrimp.svg', 'assets/squid.svg']
  };

  function foodImageFor(slotIndex){
    var set = FOOD_SETS[selectedChar] || FOOD_SETS.bunny;
    return set[slotIndex % set.length];
  }

  function makeCarrotAt(slotIndex){
    var w = window.innerWidth, h = window.innerHeight;
    var homeLeft = w*carrotSlots[slotIndex] - 36;
    var homeTop = h*slotY - 36;
    var el = document.createElement('div');
    el.className = 'carrot';
    el.style.left = homeLeft+'px';
    el.style.top = homeTop+'px';
    el.style.transform = 'scale(0)';
    el.dataset.slot = String(slotIndex);
    el.dataset.homeLeft = String(homeLeft);
    el.dataset.homeTop = String(homeTop);
    el.innerHTML = '<img class="food-img" src="' + foodImageFor(slotIndex) + '" alt="">';
    sortEl.appendChild(el);
    requestAnimationFrame(function(){
      el.style.transition = 'transform .25s cubic-bezier(.34,1.6,.64,1)';
      el.style.transform = 'scale(1)';
      setTimeout(function(){ el.style.transition = ''; }, 260);
    });
    bindCarrotDrag(el);
    return el;
  }

  function bindCarrotDrag(el){
    el.addEventListener('touchstart', function(e){
      e.preventDefault();
      ensureCtx();
      var t = e.changedTouches[0];
      var rect = el.getBoundingClientRect();
      activeDrags[t.identifier] = {
        el: el,
        offsetX: t.clientX - rect.left,
        offsetY: t.clientY - rect.top
      };
      el.classList.add('dragging');
    }, {passive:false});
    el.addEventListener('mousedown', function(e){
      e.preventDefault();
      ensureCtx();
      var rect = el.getBoundingClientRect();
      activeDrags['mouse'] = {
        el: el,
        offsetX: e.clientX - rect.left,
        offsetY: e.clientY - rect.top
      };
      el.classList.add('dragging');
    });
  }

  sortEl.addEventListener('touchmove', function(e){
    e.preventDefault();
    for (var i=0; i<e.changedTouches.length; i++){
      var t = e.changedTouches[i];
      var drag = activeDrags[t.identifier];
      if (!drag) continue;
      drag.el.style.left = (t.clientX - drag.offsetX)+'px';
      drag.el.style.top = (t.clientY - drag.offsetY)+'px';
    }
  }, {passive:false});

  document.addEventListener('mousemove', function(e){
    var drag = activeDrags['mouse'];
    if (!drag) return;
    drag.el.style.left = (e.clientX - drag.offsetX)+'px';
    drag.el.style.top = (e.clientY - drag.offsetY)+'px';
  });
  document.addEventListener('mouseup', function(){
    var drag = activeDrags['mouse'];
    if (!drag) return;
    finishDrag(drag.el);
    delete activeDrags['mouse'];
  });

  function returnHome(el){
    el.style.transition = 'left .25s ease, top .25s ease';
    el.style.left = el.dataset.homeLeft+'px';
    el.style.top = el.dataset.homeTop+'px';
    setTimeout(function(){ el.style.transition = ''; }, 260);
  }

  function reactSortBunny(){
    sortBunny.classList.remove('eating');
    void sortBunny.offsetWidth;
    sortBunny.classList.add('eating');
    setTimeout(function(){ sortBunny.classList.remove('eating'); }, 420);
  }

  function showCheer(){
    cheerTextEl.classList.remove('show');
    void cheerTextEl.offsetWidth;
    cheerTextEl.classList.add('show');
  }

  function spawnConfetti(){
    var w = window.innerWidth;
    for (var i=0; i<14; i++){
      spawnParticle(sortEl, w/2 + (Math.random()-0.5)*160, window.innerHeight*0.35);
    }
  }

  function feedCarrot(el){
    var slotIndex = parseInt(el.dataset.slot, 10);
    el.style.transition = 'transform .25s ease, opacity .25s ease';
    el.style.transform = 'scale(0.2)';
    el.style.opacity = '0';
    playChomp();
    reactSortBunny();
    fedCount++;
    countNumEl.textContent = String(fedCount);
    if (fedCount % 5 === 0){
      playCheer();
      showCheer();
      spawnConfetti();
    }
    setTimeout(function(){
      el.remove();
      makeCarrotAt(slotIndex);
    }, 260);
  }

  function finishDrag(el){
    el.classList.remove('dragging');
    var carrotRect = el.getBoundingClientRect();
    var cx = carrotRect.left + carrotRect.width/2;
    var cy = carrotRect.top + carrotRect.height*0.3;
    var mouthHit = document.getElementById('mouth-hit');
    var mouthRect = mouthHit.getBoundingClientRect();
    var mx = mouthRect.left + mouthRect.width/2;
    var my = mouthRect.top + mouthRect.height/2;
    var dist = Math.hypot(cx-mx, cy-my);
    var threshold = Math.max(mouthRect.width, mouthRect.height) * 0.85;
    if (dist < threshold){
      feedCarrot(el);
    } else {
      returnHome(el);
    }
  }

  sortEl.addEventListener('touchend', function(e){
    for (var i=0; i<e.changedTouches.length; i++){
      var t = e.changedTouches[i];
      var drag = activeDrags[t.identifier];
      if (!drag) continue;
      finishDrag(drag.el);
      delete activeDrags[t.identifier];
    }
  }, {passive:false});
  sortEl.addEventListener('touchcancel', function(e){
    for (var i=0; i<e.changedTouches.length; i++){
      var t = e.changedTouches[i];
      var drag = activeDrags[t.identifier];
      if (!drag) continue;
      returnHome(drag.el);
      delete activeDrags[t.identifier];
    }
  }, {passive:false});

  var sortInitializedFor = null;
  document.querySelector('[data-target="game-sort"]').addEventListener('click', initSortGame);
  document.querySelector('[data-target="game-sort"]').addEventListener('touchend', initSortGame);
  function initSortGame(){
    if (sortInitializedFor === selectedChar) return;
    sortInitializedFor = selectedChar;
    document.querySelectorAll('.carrot').forEach(function(el){ el.remove(); });
    for (var i=0; i<carrotSlots.length; i++){ makeCarrotAt(i); }
  }

  // ---------- Hidden picture game ----------
  function playChime(){
    playTone(880, 0.16, 0, 0.22);
    playTone(1180, 0.18, 0.07, 0.18);
  }
  function playFanfare(){
    [0,0.12,0.24,0.4].forEach(function(delay, i){
      playTone(560 + i*140, 0.22, delay, 0.24);
    });
  }

  var hiddenEl = document.getElementById('game-hidden');
  var hiddenSceneEl = document.getElementById('hidden-scene');
  var hiddenFoundNumEl = document.getElementById('hidden-found-num');
  var hiddenTotalNumEl = document.getElementById('hidden-total-num');
  var hiddenCheerEl = document.getElementById('hidden-cheer-text');
  var hiddenPositions = [
    {x:0.22, y:0.32},
    {x:0.76, y:0.24},
    {x:0.50, y:0.52},
    {x:0.18, y:0.74},
    {x:0.80, y:0.70}
  ];
  var hiddenItemSets = [
    ['⭐','🌸','🍎','🦋','💛'],
    ['🍄','🎈','🍒','🐝','🌼'],
    ['🌟','🍭','🐞','🌈','🍓']
  ];
  var hiddenRound = 0;
  var hiddenFound = 0;
  var hiddenTotal = 0;

  function buildHiddenRound(){
    hiddenSceneEl.innerHTML = '';
    hiddenFound = 0;
    var items = hiddenItemSets[hiddenRound % hiddenItemSets.length];
    hiddenTotal = items.length;
    hiddenFoundNumEl.textContent = String(hiddenFound);
    hiddenTotalNumEl.textContent = String(hiddenTotal);

    var w = window.innerWidth, h = window.innerHeight;
    items.forEach(function(emoji, i){
      var pos = hiddenPositions[i % hiddenPositions.length];
      var spot = document.createElement('div');
      spot.className = 'hidden-spot';
      spot.textContent = emoji;
      spot.style.left = (w*pos.x) + 'px';
      spot.style.top = (h*pos.y) + 'px';
      spot.dataset.found = '0';
      bindHiddenSpot(spot);
      hiddenSceneEl.appendChild(spot);
    });
  }

  function bindHiddenSpot(spot){
    function reveal(){
      if (spot.dataset.found === '1') return;
      spot.dataset.found = '1';
      spot.classList.add('found');
      ensureCtx();
      playChime();
      var rect = spot.getBoundingClientRect();
      var cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
      for (var i=0; i<8; i++){ spawnParticle(hiddenEl, cx, cy); }
      hiddenFound++;
      hiddenFoundNumEl.textContent = String(hiddenFound);
      if (hiddenFound >= hiddenTotal){
        setTimeout(function(){
          playFanfare();
          hiddenCheerEl.classList.remove('show');
          void hiddenCheerEl.offsetWidth;
          hiddenCheerEl.classList.add('show');
          var w = window.innerWidth;
          for (var i=0; i<14; i++){
            spawnParticle(hiddenEl, w/2 + (Math.random()-0.5)*160, window.innerHeight*0.35);
          }
          hiddenRound++;
          setTimeout(buildHiddenRound, 1400);
        }, 300);
      }
    }
    spot.addEventListener('touchend', function(e){ e.preventDefault(); reveal(); }, {passive:false});
    spot.addEventListener('click', reveal);
  }

  var hiddenInitialized = false;
  document.querySelector('[data-target="game-hidden"]').addEventListener('click', initHiddenGame);
  document.querySelector('[data-target="game-hidden"]').addEventListener('touchend', initHiddenGame);
  function initHiddenGame(){
    if (hiddenInitialized) return;
    hiddenInitialized = true;
    buildHiddenRound();
  }

})();
</script>
</body>
</html>
