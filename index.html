<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>토끼랑 놀이터</title>
<style>
  :root{
    --sky:#BFE9FF;
    --sun:#FFD966;
    --coral:#FF8FA3;
    --grass:#8CD790;
    --plum:#5B3A6E;
    --cream:#FFF8EC;
  }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    overscroll-behavior:none;
    touch-action:none;
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none;
    background:var(--sky);
    font-family:"Baloo 2","Comic Sans MS","Trebuchet MS",ui-rounded,sans-serif;
    overflow:hidden;
  }
  #app{
    position:fixed; inset:0;
    width:100%; height:100%;
  }
  .screen{
    position:absolute; inset:0;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }
  .screen.active{ display:flex; }

  /* ---------- HOME ---------- */
  #home{
    background:linear-gradient(180deg,var(--sky) 0%,#E4F6FF 100%);
    gap:18px;
  }
  #home h1{
    color:var(--plum);
    font-size:clamp(28px,7vw,48px);
    margin:0 0 6px 0;
    text-shadow:0 3px 0 rgba(255,255,255,0.6);
  }
  #home .sub{
    color:var(--plum);
    opacity:0.7;
    font-size:clamp(14px,3vw,18px);
    margin-bottom:10px;
  }
  .card-row{
    display:flex;
    gap:22px;
    flex-wrap:wrap;
    justify-content:center;
    padding:0 16px;
  }
  .game-card{
    width:min(30vw,180px);
    height:min(30vw,180px);
    min-width:130px; min-height:130px;
    border-radius:32px;
    border:none;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:8px;
    box-shadow:0 8px 0 rgba(0,0,0,0.12), 0 10px 20px rgba(0,0,0,0.08);
    transform:translateY(0);
    transition:transform .12s ease;
    cursor:pointer;
  }
  .game-card:active{ transform:translateY(6px); box-shadow:0 2px 0 rgba(0,0,0,0.12); }
  .game-card .emoji{ font-size:clamp(36px,8vw,54px); }
  .game-card .label{ color:white; font-weight:bold; font-size:clamp(13px,2.6vw,17px); text-align:center; padding:0 8px; }
  .game-card.ready{ background:var(--coral); }
  .game-card.soon{ background:#B9AFC7; opacity:0.85; }
  .game-card .badge{
    font-size:11px; background:rgba(255,255,255,0.85); color:var(--plum);
    padding:3px 10px; border-radius:20px; font-weight:bold;
  }

  /* ---------- CHARACTER PICKER ---------- */
  .char-picker{
    display:flex; gap:14px; margin-bottom:6px;
  }
  .char-btn{
    width:56px; height:56px; border-radius:50%;
    border:3px solid transparent;
    background:white;
    font-size:28px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 0 rgba(0,0,0,0.1);
  }
  .char-btn.selected{
    border-color:var(--sun);
    box-shadow:0 4px 0 rgba(0,0,0,0.1), 0 0 0 4px rgba(255,217,102,0.4);
  }

  /* ---------- BACK BUTTON ---------- */
  .back-btn{
    position:absolute; top:16px; left:16px;
    width:52px; height:52px; border-radius:50%;
    background:rgba(255,255,255,0.85);
    border:none;
    font-size:24px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 0 rgba(0,0,0,0.1);
    z-index:50;
  }

  /* ---------- SENSORY GAME ---------- */
  #game-sensory{
    background:var(--cream);
    transition:background-color .4s ease;
    position:absolute; inset:0;
  }
  #bunny-wrap{
    position:absolute; left:50%; top:50%;
    transform:translate(-50%,-50%);
    width:38vmin; height:38vmin;
    pointer-events:none;
  }
  #bunny-wrap svg{ width:100%; height:100%; overflow:visible; }
  .ear{ transform-origin:50% 100%; }
  #bunny-wrap.happy .ear-l{ animation:wiggleL .5s ease; }
  #bunny-wrap.happy .ear-r{ animation:wiggleR .5s ease; }
  #bunny-wrap.happy #bunny-body{ animation:bounce .5s ease; }
  @keyframes wiggleL{ 0%{transform:rotate(0)} 30%{transform:rotate(-18deg)} 60%{transform:rotate(10deg)} 100%{transform:rotate(0)} }
  @keyframes wiggleR{ 0%{transform:rotate(0)} 30%{transform:rotate(18deg)} 60%{transform:rotate(-10deg)} 100%{transform:rotate(0)} }
  @keyframes bounce{ 0%{transform:translateY(0)} 40%{transform:translateY(-4%)} 100%{transform:translateY(0)} }

  .particle{
    position:absolute;
    border-radius:50%;
    pointer-events:none;
    will-change:transform,opacity;
  }

  #sound-gate{
    position:absolute; inset:0;
    background:rgba(91,58,126,0.92);
    display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:16px;
    color:white; text-align:center; z-index:100;
  }
  #sound-gate .tap-btn{
    background:var(--sun); color:var(--plum); border:none;
    font-weight:bold; font-size:20px;
    padding:16px 32px; border-radius:40px;
    box-shadow:0 6px 0 rgba(0,0,0,0.15);
  }

  /* ---------- CARROT FEEDING GAME ---------- */
  #game-sort{
    background:linear-gradient(180deg,#DFF6E3 0%,#C9EFD1 100%);
    position:absolute; inset:0;
    overflow:hidden;
  }
  .sort-counter{
    position:absolute; top:18px; right:18px;
    background:white; color:var(--plum); font-weight:bold; font-size:20px;
    padding:8px 18px; border-radius:24px;
    box-shadow:0 4px 0 rgba(0,0,0,0.1);
    z-index:20;
  }
  #sort-bunny{
    position:absolute; left:50%; top:20%;
    transform:translate(-50%,-50%);
    width:40vmin; height:40vmin;
    pointer-events:none;
    z-index:5;
  }
  #sort-bunny svg{ width:100%; height:100%; overflow:visible; }
  #sort-bunny.eating #sort-body{ animation:bounce .4s ease; }
  #mouth-shape{ transform-origin:110px 155px; }
  #sort-bunny.eating #mouth-shape{ animation:chew .4s ease; }
  @keyframes chew{ 0%{transform:scaleY(1)} 40%{transform:scaleY(0.25)} 100%{transform:scaleY(1)} }
  #mouth-hit{
    position:absolute; left:50%; top:70%;
    width:28%; height:20%;
    transform:translate(-50%,-50%);
    pointer-events:none;
  }
  .carrot{
    position:absolute;
    width:64px; height:96px;
    touch-action:none;
    z-index:10;
    transition:none;
  }
  .carrot svg{ width:100%; height:100%; overflow:visible; filter:drop-shadow(0 4px 4px rgba(0,0,0,0.15)); }
  .carrot.dragging{ z-index:30; }
  .cheer-text{
    position:absolute; left:50%; top:38%;
    transform:translate(-50%,-50%) scale(0.6);
    color:var(--coral); font-weight:bold; font-size:clamp(24px,6vw,40px);
    text-shadow:0 3px 0 white, 0 3px 8px rgba(0,0,0,0.15);
    opacity:0;
    pointer-events:none;
    z-index:40;
  }
  .cheer-text.show{ animation:cheerPop .9s ease forwards; }
  @keyframes cheerPop{
    0%{ opacity:0; transform:translate(-50%,-50%) scale(0.5); }
    30%{ opacity:1; transform:translate(-50%,-50%) scale(1.1); }
    70%{ opacity:1; transform:translate(-50%,-50%) scale(1); }
    100%{ opacity:0; transform:translate(-50%,-60%) scale(1); }
  }
</style>
</head>
<body>
<div id="app">

  <!-- HOME SCREEN -->
  <div class="screen active" id="home">
    <h1>🐰 토끼랑 놀이터</h1>
    <div class="sub">하고 싶은 놀이를 골라보세요</div>
    <div class="char-picker" id="char-picker">
      <button class="char-btn selected" data-char="bunny">🐰</button>
      <button class="char-btn" data-char="shark">🦈</button>
    </div>
    <div class="card-row">
      <button class="game-card ready" data-target="game-sensory">
        <div class="emoji">🐰✨</div>
        <div class="label">토끼랑 콕콕</div>
      </button>
      <button class="game-card soon" data-target="game-hidden">
        <div class="emoji">🖼️</div>
        <div class="label">숨은그림찾기</div>
        <div class="badge">곧 만나요</div>
      </button>
      <button class="game-card ready" data-target="game-sort">
        <div class="emoji">🥕🐇</div>
        <div class="label">당근 먹이기</div>
      </button>
    </div>
  </div>

  <!-- GAME 1: SENSORY RESPONSE -->
  <div class="screen" id="game-sensory">
    <button class="back-btn" data-home>←</button>
    <div id="bunny-wrap"></div>
    <div id="sound-gate">
      <div style="font-size:44px;">🔊</div>
      <div style="font-size:20px; font-weight:bold;">화면을 눌러서<br>소리를 켜주세요</div>
      <button class="tap-btn" id="unlock-btn">시작!</button>
    </div>
  </div>

  <!-- GAME 2: PLACEHOLDER -->
  <div class="screen" id="game-hidden">
    <button class="back-btn" data-home>←</button>
    <div style="font-size:60px;">🖼️🔧</div>
    <div style="color:var(--plum); font-weight:bold; font-size:22px; margin-top:12px;">숨은그림찾기는 준비 중이에요!</div>
  </div>

  <!-- GAME 3: CARROT FEEDING -->
  <div class="screen" id="game-sort">
    <button class="back-btn" data-home>←</button>
    <div class="sort-counter"><span id="sort-count-num">0</span> 🥕</div>
    <div class="cheer-text" id="cheer-text">잘했어요! 🎉</div>
    <div id="sort-bunny"></div>
  </div>

</div>

<script>
(function(){
  "use strict";

  // ---------- Character system ----------
  var CHARACTERS = {
    bunny: {
      idle: `
        <ellipse class="ear ear-l" cx="70" cy="55" rx="16" ry="42" fill="#FFC9D6"/>
        <ellipse class="ear ear-l" cx="70" cy="55" rx="8" ry="30" fill="#FF8FA3"/>
        <ellipse class="ear ear-r" cx="130" cy="55" rx="16" ry="42" fill="#FFC9D6"/>
        <ellipse class="ear ear-r" cx="130" cy="55" rx="8" ry="30" fill="#FF8FA3"/>
        <g id="bunny-body">
          <ellipse cx="100" cy="130" rx="62" ry="55" fill="#FFFFFF" stroke="#EADFF0" stroke-width="3"/>
          <circle cx="78" cy="118" r="8" fill="#5B3A6E"/>
          <circle cx="122" cy="118" r="8" fill="#5B3A6E"/>
          <ellipse cx="100" cy="140" rx="10" ry="7" fill="#FF8FA3"/>
          <path d="M100 147 Q90 158 78 150" stroke="#5B3A6E" stroke-width="4" fill="none" stroke-linecap="round"/>
          <path d="M100 147 Q110 158 122 150" stroke="#5B3A6E" stroke-width="4" fill="none" stroke-linecap="round"/>
          <circle cx="65" cy="132" r="9" fill="#FFC9D6" opacity="0.7"/>
          <circle cx="135" cy="132" r="9" fill="#FFC9D6" opacity="0.7"/>
        </g>`,
      sort: `
        <ellipse class="ear" cx="82" cy="42" rx="15" ry="38" fill="#FFC9D6" transform="rotate(-8 82 42)"/>
        <ellipse class="ear" cx="82" cy="42" rx="7" ry="27" fill="#FF8FA3" transform="rotate(-8 82 42)"/>
        <ellipse class="ear" cx="138" cy="42" rx="15" ry="38" fill="#FFC9D6" transform="rotate(8 138 42)"/>
        <ellipse class="ear" cx="138" cy="42" rx="7" ry="27" fill="#FF8FA3" transform="rotate(8 138 42)"/>
        <g id="sort-body">
          <ellipse cx="110" cy="135" rx="72" ry="62" fill="#FFFFFF" stroke="#DDEBD0" stroke-width="3"/>
          <circle cx="85" cy="118" r="9" fill="#5B3A6E"/>
          <circle cx="135" cy="118" r="9" fill="#5B3A6E"/>
          <circle cx="70" cy="132" r="10" fill="#FFC9D6" opacity="0.7"/>
          <circle cx="150" cy="132" r="10" fill="#FFC9D6" opacity="0.7"/>
          <ellipse id="mouth-shape" cx="110" cy="155" rx="26" ry="19" fill="#B5406B"/>
          <ellipse cx="110" cy="160" rx="16" ry="9" fill="#7A2C4C"/>
        </g>`
    },
    shark: {
      idle: `
        <ellipse class="ear ear-l" cx="60" cy="60" rx="18" ry="30" fill="#6FB6D9" transform="rotate(-25 60 60)"/>
        <ellipse class="ear ear-r" cx="140" cy="60" rx="18" ry="30" fill="#6FB6D9" transform="rotate(25 140 60)"/>
        <g id="bunny-body">
          <ellipse cx="100" cy="125" rx="65" ry="55" fill="#8FC5DE" stroke="#5B95AF" stroke-width="3"/>
          <ellipse cx="100" cy="150" rx="42" ry="24" fill="#EAF8FC"/>
          <circle cx="78" cy="112" r="8" fill="#1B3A4B"/>
          <circle cx="122" cy="112" r="8" fill="#1B3A4B"/>
          <circle cx="78" cy="110" r="2.5" fill="white"/>
          <circle cx="122" cy="110" r="2.5" fill="white"/>
          <path d="M75 138 Q100 152 125 138 L120 145 Q100 156 80 145 Z" fill="#1B3A4B"/>
          <path d="M78 141 L83 148 L88 141 Z M96 143 L101 150 L106 143 Z M114 141 L119 148 L124 141 Z" fill="white"/>
        </g>`,
      sort: `
        <ellipse class="ear" cx="66" cy="65" rx="20" ry="34" fill="#6FB6D9" transform="rotate(-25 66 65)"/>
        <ellipse class="ear" cx="154" cy="65" rx="20" ry="34" fill="#6FB6D9" transform="rotate(25 154 65)"/>
        <g id="sort-body">
          <ellipse cx="110" cy="135" rx="72" ry="62" fill="#8FC5DE" stroke="#5B95AF" stroke-width="3"/>
          <ellipse cx="110" cy="162" rx="46" ry="26" fill="#EAF8FC"/>
          <circle cx="85" cy="118" r="9" fill="#1B3A4B"/>
          <circle cx="135" cy="118" r="9" fill="#1B3A4B"/>
          <circle cx="85" cy="116" r="3" fill="white"/>
          <circle cx="135" cy="116" r="3" fill="white"/>
          <ellipse id="mouth-shape" cx="110" cy="155" rx="26" ry="19" fill="#1B3A4B"/>
          <path d="M88 148 L96 158 L104 148 Z M108 150 L116 160 L124 150 Z M96 160 L104 168 L112 160 Z" fill="white"/>
        </g>`
    }
  };
  var selectedChar = 'bunny';

  function renderSensoryChar(){
    var el = document.getElementById('bunny-wrap');
    if (el) el.innerHTML = '<svg viewBox="0 0 200 200">' + CHARACTERS[selectedChar].idle + '</svg>';
  }
  function renderSortChar(){
    var el = document.getElementById('sort-bunny');
    if (el) el.innerHTML = '<svg viewBox="0 0 220 220">' + CHARACTERS[selectedChar].sort + '</svg><div id="mouth-hit"></div>';
  }

  document.querySelectorAll('.char-btn').forEach(function(btn){
    function selectChar(){
      selectedChar = btn.getAttribute('data-char');
      document.querySelectorAll('.char-btn').forEach(function(b){ b.classList.toggle('selected', b === btn); });
    }
    btn.addEventListener('touchend', function(e){ e.preventDefault(); selectChar(); }, {passive:false});
    btn.addEventListener('click', selectChar);
  });

  // ---------- Navigation ----------
  var screens = document.querySelectorAll('.screen');
  function showScreen(id){
    screens.forEach(function(s){ s.classList.toggle('active', s.id === id); });
  }
  document.querySelectorAll('[data-target]').forEach(function(btn){
    function openTarget(){
      var target = btn.getAttribute('data-target');
      if (target === 'game-sensory') renderSensoryChar();
      if (target === 'game-sort') renderSortChar();
      showScreen(target);
    }
    btn.addEventListener('touchend', function(e){
      e.preventDefault();
      openTarget();
    }, {passive:false});
    btn.addEventListener('click', openTarget);
  });
  document.querySelectorAll('[data-home]').forEach(function(btn){
    btn.addEventListener('touchend', function(e){ e.preventDefault(); showScreen('home'); }, {passive:false});
    btn.addEventListener('click', function(){ showScreen('home'); });
  });

  // Block iOS gestures globally (pinch-zoom, double-tap-zoom, pull-to-refresh)
  document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
  document.addEventListener('touchmove', function(e){ e.preventDefault(); }, {passive:false});
  var lastTouchEnd = 0;
  document.addEventListener('touchend', function(e){
    var now = Date.now();
    if (now - lastTouchEnd <= 300) e.preventDefault();
    lastTouchEnd = now;
  }, {passive:false});

  // ---------- Audio ----------
  var audioCtx = null;
  function ensureCtx(){
    if (!audioCtx){
      var AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function playTone(freq, duration, delay, gain){
    var ctx = ensureCtx();
    var t0 = ctx.currentTime + (delay||0);
    var osc = ctx.createOscillator();
    var g = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(gain||0.25, t0+0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t0+duration);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0+duration+0.02);
  }

  function playPop(){
    var freq = 500 + Math.random()*400;
    playTone(freq, 0.18, 0, 0.2);
    playTone(freq*1.5, 0.12, 0.02, 0.1);
  }

  function playGiggle(){
    var base = 700;
    [0,0.09,0.18].forEach(function(delay, i){
      playTone(base + i*160, 0.16, delay, 0.22);
    });
  }

  var unlockBtn = document.getElementById('unlock-btn');
  var soundGate = document.getElementById('sound-gate');
  function unlockAudio(){
    ensureCtx();
    playTone(880, 0.15, 0, 0.15);
    soundGate.style.display = 'none';
  }
  unlockBtn.addEventListener('touchend', function(e){ e.preventDefault(); unlockAudio(); }, {passive:false});
  unlockBtn.addEventListener('click', unlockAudio);

  // ---------- Sensory game: particles ----------
  var gameEl = document.getElementById('game-sensory');
  var bunnyWrap = document.getElementById('bunny-wrap');
  var palette = ['#FF8FA3','#FFD966','#8CD790','#8FD3FF','#C9A6E0'];
  var colorIdx = 0;

  function spawnParticle(container, x, y){
    var p = document.createElement('div');
    p.className = 'particle';
    var size = 26 + Math.random()*30;
    var color = palette[colorIdx % palette.length];
    colorIdx++;
    p.style.width = size+'px';
    p.style.height = size+'px';
    p.style.left = (x - size/2)+'px';
    p.style.top = (y - size/2)+'px';
    p.style.background = color;
    p.style.opacity = '0.85';
    container.appendChild(p);

    var dx = (Math.random()-0.5) * 120;
    var dy = -(60 + Math.random()*100);
    var start = null;
    var duration = 650;

    function step(ts){
      if (!start) start = ts;
      var progress = Math.min((ts-start)/duration, 1);
      p.style.transform = 'translate(' + (dx*progress) + 'px,' + (dy*progress) + 'px) scale(' + (1 - progress*0.4) + ')';
      p.style.opacity = String(0.85 * (1-progress));
      if (progress < 1){
        requestAnimationFrame(step);
      } else {
        p.remove();
      }
    }
    requestAnimationFrame(step);
  }

  function flashBackground(){
    var color = palette[colorIdx % palette.length];
    gameEl.style.backgroundColor = color + '33'; // soft tint
    clearTimeout(flashBackground._t);
    flashBackground._t = setTimeout(function(){
      gameEl.style.backgroundColor = '#FFF8EC';
    }, 280);
  }

  function isTouchOnBunny(x, y){
    var rect = bunnyWrap.getBoundingClientRect();
    var cx = rect.left + rect.width/2;
    var cy = rect.top + rect.height/2;
    var r = rect.width/2 * 0.9;
    var dist = Math.hypot(x-cx, y-cy);
    return dist < r;
  }

  var bunnyTimer = null;
  function reactBunny(){
    bunnyWrap.classList.remove('happy');
    void bunnyWrap.offsetWidth; // restart animation
    bunnyWrap.classList.add('happy');
    playGiggle();
    clearTimeout(bunnyTimer);
    bunnyTimer = setTimeout(function(){ bunnyWrap.classList.remove('happy'); }, 500);
  }

  function handleTouches(touchList){
    for (var i=0; i<touchList.length; i++){
      var t = touchList[i];
      spawnParticle(gameEl, t.clientX, t.clientY);
      if (isTouchOnBunny(t.clientX, t.clientY)){
        reactBunny();
      } else {
        playPop();
        flashBackground();
      }
    }
  }

  gameEl.addEventListener('touchstart', function(e){
    e.preventDefault();
    ensureCtx();
    handleTouches(e.changedTouches);
  }, {passive:false});

  // Mouse fallback for desktop testing
  gameEl.addEventListener('mousedown', function(e){
    handleTouches([{clientX:e.clientX, clientY:e.clientY}]);
  });

  // ---------- Carrot feeding game ----------
  function playChomp(){
    playTone(220, 0.12, 0, 0.28);
    playTone(150, 0.16, 0.06, 0.22);
  }
  function playCheer(){
    [0,0.1,0.2,0.32].forEach(function(delay, i){
      playTone(520 + i*130, 0.2, delay, 0.22);
    });
  }

  var sortEl = document.getElementById('game-sort');
  var sortBunny = document.getElementById('sort-bunny');
  var countNumEl = document.getElementById('sort-count-num');
  var cheerTextEl = document.getElementById('cheer-text');
  var fedCount = 0;
  var carrotSlots = [0.28, 0.5, 0.72]; // x fraction of screen width
  var slotY = 0.82; // y fraction of screen height
  var activeDrags = {}; // touch identifier -> {el, offsetX, offsetY}

  function carrotSVG(){
    return '<svg viewBox="0 0 60 96">' +
      '<path d="M30 8 L46 90 Q30 100 14 90 Z" fill="#FF9F45"/>' +
      '<path d="M30 8 L40 88 Q30 94 20 88 Z" fill="#FFB565"/>' +
      '<path d="M30 4 L20 -14" stroke="#4E9F52" stroke-width="6" stroke-linecap="round"/>' +
      '<path d="M30 4 L30 -18" stroke="#5FBE63" stroke-width="6" stroke-linecap="round"/>' +
      '<path d="M30 4 L40 -14" stroke="#4E9F52" stroke-width="6" stroke-linecap="round"/>' +
      '</svg>';
  }

  function makeCarrotAt(slotIndex){
    var w = window.innerWidth, h = window.innerHeight;
    var homeLeft = w*carrotSlots[slotIndex] - 32;
    var homeTop = h*slotY - 48;
    var el = document.createElement('div');
    el.className = 'carrot';
    el.style.left = homeLeft+'px';
    el.style.top = homeTop+'px';
    el.style.transform = 'scale(0)';
    el.dataset.slot = String(slotIndex);
    el.dataset.homeLeft = String(homeLeft);
    el.dataset.homeTop = String(homeTop);
    el.innerHTML = carrotSVG();
    sortEl.appendChild(el);
    requestAnimationFrame(function(){
      el.style.transition = 'transform .25s cubic-bezier(.34,1.6,.64,1)';
      el.style.transform = 'scale(1)';
      setTimeout(function(){ el.style.transition = ''; }, 260);
    });
    bindCarrotDrag(el);
    return el;
  }

  function bindCarrotDrag(el){
    el.addEventListener('touchstart', function(e){
      e.preventDefault();
      ensureCtx();
      var t = e.changedTouches[0];
      var rect = el.getBoundingClientRect();
      activeDrags[t.identifier] = {
        el: el,
        offsetX: t.clientX - rect.left,
        offsetY: t.clientY - rect.top
      };
      el.classList.add('dragging');
    }, {passive:false});
    el.addEventListener('mousedown', function(e){
      e.preventDefault();
      ensureCtx();
      var rect = el.getBoundingClientRect();
      activeDrags['mouse'] = {
        el: el,
        offsetX: e.clientX - rect.left,
        offsetY: e.clientY - rect.top
      };
      el.classList.add('dragging');
    });
  }

  sortEl.addEventListener('touchmove', function(e){
    e.preventDefault();
    for (var i=0; i<e.changedTouches.length; i++){
      var t = e.changedTouches[i];
      var drag = activeDrags[t.identifier];
      if (!drag) continue;
      drag.el.style.left = (t.clientX - drag.offsetX)+'px';
      drag.el.style.top = (t.clientY - drag.offsetY)+'px';
    }
  }, {passive:false});

  document.addEventListener('mousemove', function(e){
    var drag = activeDrags['mouse'];
    if (!drag) return;
    drag.el.style.left = (e.clientX - drag.offsetX)+'px';
    drag.el.style.top = (e.clientY - drag.offsetY)+'px';
  });
  document.addEventListener('mouseup', function(){
    var drag = activeDrags['mouse'];
    if (!drag) return;
    finishDrag(drag.el);
    delete activeDrags['mouse'];
  });

  function returnHome(el){
    el.style.transition = 'left .25s ease, top .25s ease';
    el.style.left = el.dataset.homeLeft+'px';
    el.style.top = el.dataset.homeTop+'px';
    setTimeout(function(){ el.style.transition = ''; }, 260);
  }

  function reactSortBunny(){
    sortBunny.classList.remove('eating');
    void sortBunny.offsetWidth;
    sortBunny.classList.add('eating');
    setTimeout(function(){ sortBunny.classList.remove('eating'); }, 420);
  }

  function showCheer(){
    cheerTextEl.classList.remove('show');
    void cheerTextEl.offsetWidth;
    cheerTextEl.classList.add('show');
  }

  function spawnConfetti(){
    var w = window.innerWidth;
    for (var i=0; i<14; i++){
      spawnParticle(sortEl, w/2 + (Math.random()-0.5)*160, window.innerHeight*0.35);
    }
  }

  function feedCarrot(el){
    var slotIndex = parseInt(el.dataset.slot, 10);
    el.style.transition = 'transform .25s ease, opacity .25s ease';
    el.style.transform = 'scale(0.2)';
    el.style.opacity = '0';
    playChomp();
    reactSortBunny();
    fedCount++;
    countNumEl.textContent = String(fedCount);
    if (fedCount % 5 === 0){
      playCheer();
      showCheer();
      spawnConfetti();
    }
    setTimeout(function(){
      el.remove();
      makeCarrotAt(slotIndex);
    }, 260);
  }

  function finishDrag(el){
    el.classList.remove('dragging');
    var carrotRect = el.getBoundingClientRect();
    var cx = carrotRect.left + carrotRect.width/2;
    var cy = carrotRect.top + carrotRect.height*0.3;
    var mouthHit = document.getElementById('mouth-hit');
    var mouthRect = mouthHit.getBoundingClientRect();
    var mx = mouthRect.left + mouthRect.width/2;
    var my = mouthRect.top + mouthRect.height/2;
    var dist = Math.hypot(cx-mx, cy-my);
    var threshold = Math.max(mouthRect.width, mouthRect.height) * 0.85;
    if (dist < threshold){
      feedCarrot(el);
    } else {
      returnHome(el);
    }
  }

  sortEl.addEventListener('touchend', function(e){
    for (var i=0; i<e.changedTouches.length; i++){
      var t = e.changedTouches[i];
      var drag = activeDrags[t.identifier];
      if (!drag) continue;
      finishDrag(drag.el);
      delete activeDrags[t.identifier];
    }
  }, {passive:false});
  sortEl.addEventListener('touchcancel', function(e){
    for (var i=0; i<e.changedTouches.length; i++){
      var t = e.changedTouches[i];
      var drag = activeDrags[t.identifier];
      if (!drag) continue;
      returnHome(drag.el);
      delete activeDrags[t.identifier];
    }
  }, {passive:false});

  var sortInitialized = false;
  document.querySelector('[data-target="game-sort"]').addEventListener('click', initSortGame);
  document.querySelector('[data-target="game-sort"]').addEventListener('touchend', initSortGame);
  function initSortGame(){
    if (sortInitialized) return;
    sortInitialized = true;
    for (var i=0; i<carrotSlots.length; i++){ makeCarrotAt(i); }
  }

})();
</script>
</body>
</html>
